services:
  app:
    build: .
    image: wedding-landing:latest
    restart: unless-stopped
    env_file: .env            # GOOGLE_SERVICE_ACCOUNT_EMAIL, GOOGLE_PRIVATE_KEY, GOOGLE_SHEET_ID (xem .env.example)
    environment:
      PORT: "3000"
    ports:
      - "${APP_PORT:-3000}:3000"   # cổng mở ra VM để Kong/NAT trỏ vào
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
